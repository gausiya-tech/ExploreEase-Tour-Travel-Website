<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ExploreEase{% endblock %}</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#243047}
    header{background:#123b5d;padding:16px 6%;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
    header a{color:white;text-decoration:none;font-weight:bold}
    main{max-width:1000px;margin:30px auto;padding:0 18px}
    .card{background:white;padding:20px;margin:14px 0;border-radius:10px;box-shadow:0 2px 10px #0001}
    input,textarea,select{display:block;width:100%;padding:10px;margin:7px 0 15px;box-sizing:border-box}
    button,.button{background:#087e8b;color:white;padding:10px 16px;border:0;border-radius:5px;text-decoration:none;cursor:pointer}
    img{max-width:220px;height:auto;border-radius:8px}
    .message{background:#e0f5e9;padding:10px;border-radius:6px}
    footer{text-align:center;padding:24px;background:#123b5d;color:white;margin-top:40px}
  </style>
</head>
<body>
<header>
  <a href="/">ExploreEase</a><a href="/packages/">Packages</a><a href="/booking/">Book</a>
  <a href="/gallery/">Gallery</a><a href="/reviews/">Reviews</a><a href="/about/">About / Team</a><a href="/contact/">Contact</a>
  <a href="/admin/">Admin</a>
</header>
<main>
  {% if messages %}{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main>
<footer>ExploreEase – Tour &amp; Travel Website</footer>
</body>
</html>
