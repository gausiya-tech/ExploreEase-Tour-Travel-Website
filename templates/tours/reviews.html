{% extends "base.html" %}
{% block content %}<h1>Customer Reviews</h1>
<div class="card"><h2>Share your review</h2><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button type="submit">Submit Review</button></form></div>
{% for item in items %}<div class="card"><h3>{{ item.name }}</h3><p>{{ item.message }}</p>{% if item.picture %}<img src="{{ item.picture.url }}" alt="Reviewer">{% endif %}</div>
{% empty %}<p>No reviews yet.</p>{% endfor %}
{% endblock %}
